name: tests

# Pull requests from forks run with a read-only token and no secrets, which is
# what makes it safe to run a contributor's branch on GitHub's own runners.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"   # the oldest a bare server is likely to have

      - name: Bridge and tools
        run: python -m unittest discover -s tests -v

      - name: The page boots
        run: node --test tests/*.mjs

      - name: Everything compiles
        run: python -m compileall -q bridge tools tests render

      # The real inputs are Wube's artwork: it cannot be committed, and a
      # GitHub runner has neither Factorio nor a licence. So the build is
      # proved against a synthetic extract the tests generate — same index
      # shapes, sheets written by the project's own PNG writer — which
      # exercises the whole pipeline without the game.
      - name: The sprite build runs end to end
        run: |
          python - <<'PY'
          import sys, tempfile, os
          sys.path.insert(0, "tests")
          from test_build import Extract, build
          root = tempfile.mkdtemp()
          source, target = os.path.join(root, "extract"), os.path.join(root, "built")
          Extract(source)
          record = build.build(source, target)
          checked, problems = build.verify(source, target)
          assert not problems, problems
          assert record["bytes_out"] < record["bytes_in"]
          print("built %d files, verified %d crops, %d -> %d bytes"
                % (len(record["files"]), checked, record["bytes_in"], record["bytes_out"]))
          PY

  scenario:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install luacheck
        run: sudo apt-get update && sudo apt-get install -y lua-check

      # An uncaught error in a command does not kill the command, it kills the
      # server. A `nil` in a table literal makes a hole that hides everything
      # behind it. Both are the kind of thing a linter sees and review does not.
      - name: Lint the scenario
        run: luacheck scenario/control.lua
